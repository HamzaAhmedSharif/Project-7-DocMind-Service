[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"evaluation/questions.py" = ["E501"]
"evaluation/scoring.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --strict-markers -m 'not integration and not model'"
markers = [
  "integration: needs a Postgres+pgvector database (DOCMIND_TEST_DATABASE_URL)",
  "model: needs the ONNX embedding model files (downloads on first use)",
]
