name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:                                     # G1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  typecheck:                                # mypy, non-blocking: 25 known errors (DECISIONS.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m mypy docmind_service

  unit:                                     # G2 + G3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q --cov=docmind_service --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: coverage, path: coverage.xml}
      - name: Contract drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  retrieval-eval:                           # G4 (+ E1 diagnostic)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: docmind_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCMIND_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docmind_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ hashFiles('requirements.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/cache
          key: corpus-${{ hashFiles('evaluation/corpus.json') }}
      - run: python scripts/fetch_reranker.py --model Xenova/ms-marco-MiniLM-L-6-v2 --out "${{ runner.temp }}/models"
      - run: python scripts/fetch_corpus.py --manifest evaluation/corpus.json --out data/cache
      - run: python -m pytest -q -m "integration or model"
        env: {DOCMIND_MODEL_CACHE_DIR: "${{ runner.temp }}/models"}
      - run: python -m evaluation.run_retrieval --out evaluation/results/retrieval-ci.json --label ci
        env: {DOCMIND_MODEL_CACHE_DIR: "${{ runner.temp }}/models"}
      - name: Gates
        run: python -m evaluation.check_gates --results evaluation/results/retrieval-ci.json --stage retrieval --markdown-out gate-table.md
      - name: Comment the gate table on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file gate-table.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: retrieval-results, path: "evaluation/results/retrieval-ci.json"}

  security:                                 # G5
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      # gitleaks step exactly as fixed in P0.5 (pinned binary, SHA-256 checked, full history)
      - name: Install pinned gitleaks and scan the full history
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --no-deps --disable-pip

  image:                                    # G6 + G7
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t docmind-service:ci .
      - name: "Trivy (blocking: CRITICAL with a fix available)"
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress docmind-service:ci
      - name: "Trivy (report: HIGH and CRITICAL)"
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --severity HIGH,CRITICAL --exit-code 0 --no-progress docmind-service:ci
      - name: Container smoke
        run: |
          docker compose -f deploy/compose.ci.yml up -d --build --wait
          SMOKE_KEY=$(docker compose -f deploy/compose.ci.yml exec -T app \
            python -m docmind_service.admin create-key --tenant smoke-ci --label ci --write \
            | sed -n '/^-----BEGIN DOCMIND KEY-----$/{n;p;}')
          test -n "$SMOKE_KEY"
          DOCMIND_SMOKE_KEY="$SMOKE_KEY" python3 scripts/smoke_http.py \
            --base http://127.0.0.1:8000 --mode ci --api-key-env DOCMIND_SMOKE_KEY
      - if: failure()
        run: docker compose -f deploy/compose.ci.yml logs --no-color --tail 200
      - if: always()
        run: docker compose -f deploy/compose.ci.yml down -v

  release:                                  # main only: publish the image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, retrieval-eval, security, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')/docmind-service
          docker build --build-arg GIT_SHA=${GITHUB_SHA} --label org.opencontainers.image.revision=${GITHUB_SHA} --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t "$IMAGE:sha-${GITHUB_SHA::7}" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
