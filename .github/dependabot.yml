version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    ignore:
      # The base python image is pinned deliberately (see DECISIONS.md,
      # P7.1 entry); Dependabot PR #1 (3.12 -> 3.15) was closed, not merged.
      - dependency-name: python
